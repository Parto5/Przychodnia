<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kontakt – Przychodnia Online</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<!-- wklejony wspólny nagłówek z fragments -->
<div th:replace="fragments/header :: siteHeader(activePage = 'contact')"></div>

<div th:replace="fragments/logo :: siteLogo"></div>

<div class="container my-5">

    <div class="p-4 shadow rounded bg-white">
        <h2 class="mb-4">Skontaktuj się z nami</h2>

        <p>Masz pytania? Chcesz umówić wizytę telefonicznie? Zapraszamy do kontaktu!</p>

        <h4 class="mt-4">Dane kontaktowe</h4>
        <ul class="mb-4">
            <li><strong>Telefon:</strong> +48 123 456 789</li>
            <li><strong>Email:</strong> kontakt@przychodnia.pl</li>
            <li><strong>Adres:</strong> ul. Zdrowa 12, 00-000 Warszawa</li>
        </ul>

        <!-- MAPA (placeholder) -->
        <h4 class="mt-4">Mapa dojazdu</h4>
        <img src="/images/dojazd.jpeg"
             alt="Mapa dojazdu"
             class="img-fluid rounded mb-4">

    </div>

</div>

<div th:replace="fragments/footer :: siteFooter"></div>

</body>
</html>
