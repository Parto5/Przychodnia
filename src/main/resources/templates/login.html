<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logowanie – Przychodnia Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="app-header">
    <div class="app-header-main">
        <div class="logo-area">
            <div class="logo-circle">P</div>
            <div>
                <h1 class="app-title">Przychodnia Online</h1>
                <p class="app-subtitle">Logowanie do systemu</p>
            </div>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="/przychodnia" class="nav-link-main">Strona główna</a></li>
                <li><a href="/o-przychodni" class="nav-link-main">O przychodni</a></li>
                <li><a href="/kontakt" class="nav-link-main">Kontakt</a></li>
            </ul>
        </nav>
    </div>
</header>


<div class="container d-flex justify-content-center mt-5">
    <div class="auth-box shadow p-4" style="max-width: 450px; width: 100%; border-radius: 15px; background: var(--white);">
        <h2 class="mb-4 text-center">Logowanie</h2>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label for="username" class="form-label">Nazwa użytkownika</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Hasło</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Zaloguj</button>

            <div class="mt-3" th:if="${param.error}">
                <p class="text-danger text-center">❌ Nieprawidłowy login lub hasło</p>
            </div>

            <div class="mt-3" th:if="${param.logout}">
                <p class="text-success text-center">✔ Zostałeś wylogowany</p>
            </div>

        </form>

        <hr>

        <p class="text-center">Nie masz konta?</p>
        <a href="/register" class="btn btn-outline-success w-100">Utwórz konto</a>
    </div>
</div>

</body>
</html>
