<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>O przychodni – Przychodnia Online</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<!-- wklejony wspólny nagłówek z fragments -->
<div th:replace="fragments/header :: siteHeader(activePage='info')"></div>

<div th:replace="fragments/logo :: siteLogo"></div>

<div class="container my-5">

    <div class="p-4 shadow rounded bg-white">
        <h2 class="mb-4">O naszej przychodni</h2>

        <p th:each="line : ${infoLines}" th:text="${line}"></p>

        <h4 class="mt-4">Dlaczego warto nas wybrać?</h4>

        <ul>
            <li>Doświadczeni lekarze z wielu specjalizacji.</li>
            <li>Możliwość rejestracji wizyt online.</li>
            <li>Nowoczesny system zarządzania terminami.</li>
            <li>Przyjazna atmosfera i profesjonalne podejście.</li>
        </ul>
    </div>

</div>

<div th:replace="fragments/footer :: siteFooter"></div>

</body>
</html>
