<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja – Przychodnia Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="app-header">
    <div class="app-header-main">
        <div class="logo-area">
            <div class="logo-circle">P</div>
            <div>
                <h1 class="app-title">Przychodnia Online</h1>
                <p class="app-subtitle">Rejestracja nowego użytkownika</p>
            </div>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="/przychodnia" class="nav-link-main">Strona główna</a></li>
                <li><a href="/o-przychodni" class="nav-link-main">O przychodni</a></li>
                <li><a href="/kontakt" class="nav-link-main">Kontakt</a></li>
            </ul>
        </nav>
    </div>
</header>

<div class="container d-flex justify-content-center mt-5">
    <div class="auth-box shadow p-4" style="max-width: 500px; width: 100%; border-radius: 15px; background: var(--white);">
        <h2 class="mb-4 text-center">Utwórz nowe konto</h2>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post">

            <div class="mb-3">
                <label class="form-label">Nazwa użytkownika</label>
                <input type="text" class="form-control" th:field="*{username}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Hasło</label>
                <input type="password" class="form-control" th:field="*{password}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Imię i nazwisko</label>
                <input type="text" class="form-control" th:field="*{name}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Rola użytkownika</label>
                <select class="form-select" th:field="*{role}">
                    <option value="PATIENT">Pacjent</option>
                    <option value="DOCTOR">Lekarz</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">Zarejestruj</button>

        </form>

        <hr>

        <p class="text-center">Masz już konto?</p>
        <a href="/login" class="btn btn-outline-primary w-100">Przejdź do logowania</a>
    </div>
</div>

</body>
</html>
