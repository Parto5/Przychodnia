<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nowa wizyta – Przychodnia Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<!-- HEADER (spójny z pozostałymi stronami) -->
<header class="app-header">
    <div class="app-header-main">

        <!-- Logo -->
        <div class="logo-area">
            <div class="logo-circle">P</div>
            <div>
                <h1 class="app-title">Przychodnia Online</h1>
                <p class="app-subtitle">Dodawanie nowej wizyty</p>
            </div>
        </div>

        <!-- Nawigacja -->
        <nav class="main-nav">
            <ul>
                <li><a href="/przychodnia" class="nav-link-main">Strona główna</a></li>
                <li><a href="/o-przychodni" class="nav-link-main">O przychodni</a></li>
                <li><a href="/kontakt" class="nav-link-main">Kontakt</a></li>
            </ul>
        </nav>

        <!-- Panel logowania -->
        <div class="login-actions">
            <a href="/logout" class="btn btn-sm btn-outline-danger">Wyloguj</a>
        </div>
    </div>
</header>


<!-- GŁÓWNA ZAWARTOŚĆ -->
<div class="container d-flex justify-content-center mt-5">

    <div class="auth-box shadow p-4"
         style="max-width: 500px; width: 100%; border-radius: 15px; background: var(--white);">

        <h2 class="mb-4 text-center">Dodaj nową wizytę</h2>

        <form th:action="@{/przychodnia/new}" th:object="${appointment}" method="post">

            <!-- DATA + GODZINA -->
            <div class="mb-3">
                <label for="dateTime" class="form-label">Data i godzina wizyty</label>
                <input type="datetime-local"
                       class="form-control"
                       id="dateTime"
                       th:field="*{dateTime}"
                       required />
            </div>

            <!-- PRZYCISKI -->
            <div class="d-flex justify-content-between mt-4">

                <a th:href="@{'/przychodnia?date=' + ${appointment.dateTime != null ? appointment.dateTime.toLocalDate() : ''}}"
                   class="btn btn-outline-secondary">
                    Powrót
                </a>

                <button type="submit" class="btn btn-success">Dodaj wizytę</button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
