<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Przychodnia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container my-4">
    <div class="container-box">
        <img src="https://przychodnianr1.pl/images/bg-image/mainbanner1-1-1.webp" alt="Link do obrazu" class="header-image">
        <div class="d-flex justify-content-between align-items-center mt-3">
            <h2 class="mb-0">Przychodnia - rejestracja online</h2>
            <div class="d-flex gap-2">
                <a href="/login" class="btn btn-outline-primary">Logowanie</a>
                <a href="/register" class="btn btn-outline-success">Zarejestruj się</a>
            </div>
        </div>
        <p class="mt-3">Zalogowany jako: <strong th:text="${username + ' ' + realname}"></strong> (<span th:text="${role}">ROLA</span>)</p>

        <form method="get" action="/przychodnia" class="row g-3 mb-4">
            <div class="col-auto">
                <label for="date" class="form-label">Wybierz datę:</label>
            </div>
            <div class="col-auto">
                <input type="date" id="date" name="date" class="form-control" th:value="${selectedDate}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Pokaż</button>
            </div>
        </form>

        <table class="table table-bordered table-striped">
            <thead class="table-success">
            <tr>
                <th>Godzina</th>
                <th>Lekarz</th>
                <th>Status</th>
                <th th:if="${role == 'DOCTOR'}">Pacjent</th>
                <th>Akcja</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${appointments}" th:classappend="${a.reservedBy?.getName() == realname} ? 'highlight-row'">
                <td th:text="${#temporals.format(a.dateTime, 'HH:mm')}">10:00</td>
                <td th:text="${a.doctor.name}">Dr. Test</td>
                <td th:text="${a.status.name()}">OPEN</td>
                <td th:if="${role == 'DOCTOR'}" th:text="${a.reservedBy != null ? a.reservedBy.getName() : '-'}">-</td>
                <td>
                    <div class="d-flex gap-2">
                        <!-- PACJENT: może rezerwować -->
                        <form th:if="${role == 'PATIENT' and a.status.name() == 'Open'}"
                              method="post" th:action="@{'/przychodnia/' + ${a.id} + '/reserve'}">
                            <input type="hidden" name="selectedDate" th:value="${selectedDate}" />
                            <button type="submit" class="btn btn-success btn-sm">Rezerwuj</button>
                        </form>

                        <!-- LEKARZ: może zaakceptować -->
                        <form th:if="${role == 'DOCTOR' and a.status.name() == 'Reserved'}"
                              method="post" th:action="@{'/przychodnia/' + ${a.id} + '/accept'}">
                            <input type="hidden" name="selectedDate" th:value="${selectedDate}" />
                            <button type="submit" class="btn btn-primary btn-sm">Akceptuj</button>
                        </form>

                        <!-- LEKARZ: może zwolnić -->
                        <form th:if="${role == 'DOCTOR' and a.status.name() != 'Open'}"
                              method="post" th:action="@{'/przychodnia/' + ${a.id} + '/release'}">
                            <input type="hidden" name="selectedDate" th:value="${selectedDate}" />
                            <button type="submit" class="btn btn-warning btn-sm">Zwolnij</button>
                        </form>

                        <!-- NIC -->
                        <span th:if="${role == 'PATIENT' and a.status.name() != 'Open'}" class="text-muted">Zajęte</span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:if="${role == 'DOCTOR'}" class="mb-3">
            <a th:href="@{/przychodnia/new(date=${selectedDate})}" class="btn btn-success">Dodaj wizytę</a>
        </div>
    </div>
</div>
</body>
</html>
